<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#123B65">
  <title>Bibliothèque de documents — MaBiblio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
  <script src="/activity.js" defer></script>
  <script src="/library.js" defer></script>
</head>
<body>
  <header class="site-header">
    <div class="container header-inner library-header-inner">
      <a class="brand" href="/" aria-label="Accueil MaBiblio"><span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 32 32" fill="none"><path d="M4 11.2 16 5l12 6.2L16 17.5 4 11.2Z" fill="currentColor"/><path d="M8 14v7.1c4.8 3.8 11.2 3.8 16 0V14l-8 4.2L8 14Z" fill="currentColor" opacity=".72"/><path d="M28 11.5v8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></span><span>Ma<span class="brand-accent">Biblio</span></span></a>
      <a class="text-button" href="/">← Retour à l’accueil</a>
    </div>
  </header>
  <main class="library-page">
    <section class="section resources-section">
      <div class="container">
        <div class="section-heading resources-heading">
          <div><div class="eyebrow">RESSOURCES ÉTUDIANTES APPROUVÉES</div><h1>Bibliothèque de documents</h1><p>Parcourez les cours, examens, TD et TP approuvés par l’administration.</p></div>
        </div>
        <form class="library-filters academic-filters" id="library-filters">
          <label>Niveau académique<select id="library-level" name="academicLevel"></select></label>
          <label>Filière<select id="library-major" name="major"></select></label>
          <label>Catégorie<select id="library-category" name="category"><option value="">Toutes les catégories</option><option value="Exams">Examens</option><option value="Courses">Cours</option><option value="TD &amp; TP">TD &amp; TP</option></select></label>
          <label id="library-year-wrap">Année académique<select id="library-year" name="academicYear"></select></label>
          <label>Semestre<select id="library-semester" name="semester"></select></label>
          <label>Module<select id="library-module" name="module"></select></label>
          <label id="library-type-wrap">Type de document<select id="library-type" name="documentType"></select></label>
          <label id="library-exam-wrap">Type d’examen<select id="library-exam-type" name="examType"></select></label>
          <label>Rechercher<input id="library-search" type="search" placeholder="Rechercher un titre ou un module"></label>
          <button class="button button-primary library-apply" type="submit">Appliquer les filtres</button>
        </form>
        <div class="carousel-heading library-heading"><span class="gallery-count" id="library-count">Chargement des documents approuvés…</span><div class="carousel-controls"><button class="carousel-arrow" id="library-scroll-prev" type="button" aria-label="Faire défiler vers la gauche" disabled>←</button><button class="carousel-arrow" id="library-scroll-next" type="button" aria-label="Faire défiler vers la droite" disabled>→</button></div></div>
        <div class="carousel-viewport" id="library-carousel" tabindex="0" aria-label="Bibliothèque de documents"><div class="carousel-track" id="library-track"></div></div>
        <p class="empty-state" id="library-empty" hidden>Aucun document approuvé ne correspond à ces filtres.</p>
        <p class="resource-error" id="library-error" role="status" hidden></p>
        <p class="library-page-status" id="library-page-status"></p>
        <div class="library-pagination"><button class="button button-secondary" id="library-prev" type="button" disabled>8 précédents</button><button class="button button-secondary" id="library-next" type="button" disabled>8 suivants</button></div>
      </div>
    </section>
  </main>
  <footer class="site-footer">  <div class="container footer-inner"><a class="brand footer-brand" href="/">Ma<span class="brand-accent">Biblio</span></a><p>Apprendre et partager, ensemble.</p></div></footer>
</body>
</html>
